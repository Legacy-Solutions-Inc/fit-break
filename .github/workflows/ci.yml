name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json — do
      # NOT also set `version:` here (pnpm/action-setup errors on a duplicate).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Volta pin / .nvmrc — posthog-node requires node >=22.22.0.
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type:check

      - run: pnpm test:coverage

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - run: pnpm build

  # Dependency review runs only on pull requests (it diffs the base vs head
  # dependency manifests) and fails the PR on high-severity vulnerable deps.
  # It needs the Dependency graph (and GitHub Advanced Security on private
  # repos). continue-on-error keeps CI green while those are not enabled; drop
  # it once they are turned on in Settings → Code security.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
