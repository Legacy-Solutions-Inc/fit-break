  <!-- Auth Modal -->
  <div id="modal-auth" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-gray-100 overflow-hidden transform transition-all my-auto max-h-[90vh] overflow-y-auto">
      <!-- Modal Header -->
      <div class="p-6 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-brand-50 to-brand-50">
        <h2 id="auth-title" class="text-2xl font-bold text-gray-900">Sign In</h2>
        <button data-close class="p-2 hover:bg-white/50 rounded-full transition-colors">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6">
        <form id="auth-form" class="space-y-4">
          <input type="hidden" id="auth-mode" value="signin" />

          <!-- Name Field (only for signup) -->
          <div id="auth-name-field" style="display: none;">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
            <input
              type="text"
              name="auth-name"
              placeholder="Jane Dela Cruz"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-transparent transition-all"
            />
          </div>

          <!-- Phone Field (only for signup, optional) -->
          <div id="auth-phone-field" style="display: none;">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number <span class="text-gray-400 font-normal">(optional)</span></label>
            <input
              type="tel"
              name="auth-phone"
              placeholder="09XX XXX XXXX"
              class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-transparent transition-all"
            />
            <p class="text-xs text-gray-500 mt-1">For class reminders and important updates</p>
          </div>

          <!-- Email Field -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
            <input
              type="email"
              name="auth-email"
              placeholder="you@email.com"
              required
              class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-transparent transition-all"
            />
          </div>

          <!-- Password Field -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
            <input
              type="password"
              name="auth-password"
              placeholder="••••••••"
              required
              class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-transparent transition-all"
            />
          </div>

          <!-- Forgot Password Link (only for signin) -->
          <div id="forgot-password-link" class="text-right">
            <button type="button" id="btn-forgot-password" class="text-sm text-brand-600 hover:text-brand-700 font-semibold">
              Forgot password?
            </button>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="auth-submit-btn"
            class="w-full px-6 py-3 bg-brand-500 text-white font-semibold rounded-xl hover:bg-brand-600 transition-all shadow-md hover:shadow-lg transform hover:scale-[1.02]"
          >
            Sign In
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500 font-medium">Or continue with</span>
          </div>
        </div>

        <!-- Social Sign In Buttons - Stacked with Google on top -->
        <div class="flex flex-col gap-3">
          <!-- Google Sign In (Primary - on top) -->
          <button
            type="button"
            id="btn-google-signin"
            class="w-full flex items-center justify-center gap-2 px-4 py-3 border-2 border-gray-200 rounded-xl hover:bg-gray-50 transition-all font-semibold text-gray-700"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </button>

          <!-- Facebook Sign In -->
          <button
            type="button"
            id="btn-facebook-signin"
            class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-[#1877F2] text-white rounded-xl hover:bg-[#166FE5] transition-all font-semibold"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Continue with Facebook
          </button>
        </div>

        <!-- Toggle Sign In / Sign Up -->
        <div class="mt-6 text-center relative" style="z-index: 10;">
          <button
            type="button"
            id="btn-toggle-auth-mode"
            class="text-sm text-gray-600 hover:text-gray-900 cursor-pointer transition-colors p-3 underline-offset-2 hover:underline border border-transparent hover:border-gray-300 rounded-lg w-full"
            style="pointer-events: all !important; user-select: none; -webkit-tap-highlight-color: transparent;"
          >
            <span id="toggle-auth-text">Don't have an account? <strong class="text-brand-600 font-semibold">Sign Up</strong></span>
          </button>
        </div>
      </div>
    </div>
  </div>
